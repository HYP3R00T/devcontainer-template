[project]
site_name = "DevContainer Template"
site_description = "A reusable foundation for consistent development environments and maintainable project workflows."
repo_name = "HYP3R00T/devcontainer-template"
repo_url = "https://github.com/HYP3R00T/devcontainer-template"
site_author = "HYP3R00T"
copyright = "Copyright &copy; 2026 HYP3R00T"

nav = [
  { Home = "index.md" },
  { Introduction = [
    { "Why this template exists" = "learn/philosophy.md" },
    { "The project model" = "project-model.md" },
    { "Getting started" = "learn/getting-started.md" },
  ] },
  { Foundations = [
    { Overview = "foundations/index.md" },
    { "Dev Container" = "concepts/dev-container.md" },
    { Mise = "concepts/mise.md" },
    { "Project entry" = "concepts/project-entry.md" },
    { EditorConfig = "concepts/editorconfig.md" },
    { "Git attributes" = "concepts/git-attributes.md" },
    { "Git ignore" = "concepts/git-ignore.md" },
    { README = "foundations/readme.md" },
    { "Git hooks" = [
      { Overview = "concepts/git-hooks/index.md" },
      { Providers = "concepts/git-hooks/repositories/index.md" },
      { "pre-commit-hooks" = "concepts/git-hooks/repositories/pre-commit-hooks.md" },
      { "rumdl-pre-commit" = "concepts/git-hooks/repositories/rumdl-pre-commit.md" },
      { Commitizen = "concepts/git-hooks/repositories/commitizen.md" },
      { shellcheck-py = "concepts/git-hooks/repositories/shellcheck-py.md" },
    ] },
  ] },
  { Constraints = [
    { Overview = "constraints/index.md" },
    { "Hard constraints" = "constraints/hard.md" },
    { "Soft constraints" = "constraints/soft.md" },
  ] },
  { "Development workflow" = [
    { Overview = "workflow/index.md" },
    { "Start a project" = "workflow/start-project.md" },
    { "Iterative development" = "workflow/iteration.md" },
    { "Priorities and dependencies" = "workflow/priorities.md" },
    { Traceability = "workflow/traceability.md" },
    { "Maintenance and releases" = "workflow/maintenance.md" },
  ] },
  { "Adapt the template" = "adaptation.md" },
  { Automation = [
    { Dependabot = "automation/dependabot.md" },
  ] },
  { Governance = [
    { License = "governance/license.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
scheme = "default"
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
scheme = "slate"
media = "(prefers-color-scheme: dark)"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/layout-template"
repo = "fontawesome/brands/github"
next = "lucide/arrow-right"
previous = "lucide/arrow-left"
search = "lucide/search"
top = "lucide/arrow-up"
edit = "lucide/file-pen-line"
view = "lucide/file-braces-corner"

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
