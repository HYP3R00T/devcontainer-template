[tools]
prek = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }

[settings]
experimental = true
lockfile = true

[settings.github]
use_git_credentials = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh", run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/enter_project.ps1" }

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"

[env]
_.file = ".env"  # for sensitive data
UV_LINK_MODE = "copy"
